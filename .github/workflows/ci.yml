name: Build and rehearse
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      container_rehearsal:
        description: Run real Docker upgrade, rollback and restore (slower)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: support-chat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: support-chat
      - name: Read pinned OpenIM revision
        id: revision
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"],"a").write("commit="+json.load(open("VERSION.json"))["openimCommit"]+"\n")'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openimsdk/open-im-server
          ref: ${{ steps.revision.outputs.commit }}
          path: open-im-server
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            support-chat/server/go.sum
            open-im-server/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: support-chat/web/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Build checked release
        run: ./manage build --version '0.0.0-ci.${{ github.run_number }}.1' --version-code '${{ github.run_number }}'
      - name: Real container rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.container_rehearsal }}
        run: |
          ./manage bundle 'artifacts/releases/0.0.0-ci.${{ github.run_number }}.1'
          ./manage build --android none --version '0.0.0-ci.${{ github.run_number }}.2'
          ./manage bundle 'artifacts/releases/0.0.0-ci.${{ github.run_number }}.2' --base 'artifacts/releases/0.0.0-ci.${{ github.run_number }}.1-bundle'
          python3 scripts/rehearse.py 'artifacts/releases/0.0.0-ci.${{ github.run_number }}.1-bundle' 'artifacts/releases/0.0.0-ci.${{ github.run_number }}.2-bundle' --work-root artifacts/rehearsal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-${{ github.run_number }}
          path: |
            support-chat/artifacts/releases/*/*.apk
            support-chat/artifacts/releases/*/release.json
            support-chat/artifacts/releases/*/source.tar.gz
            support-chat/artifacts/releases/*/web.tar.gz
            support-chat/artifacts/releases/*/gateway
            support-chat/artifacts/releases/*/openim
            support-chat/artifacts/rehearsal/result.json
          retention-days: 14
